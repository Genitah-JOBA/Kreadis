<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@800&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1080px; height: 1080px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(circle at 22% 18%, rgba(255,255,255,.28), transparent 42%),
      radial-gradient(circle at 85% 90%, rgba(11,11,20,.45), transparent 55%),
      linear-gradient(135deg, #7c5cff 0%, #5b6cff 45%, #22d3ee 100%);
    font-family: 'Sora', sans-serif;
  }
  /* Fines lignes de grille, rappel "design" */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(circle at center, #000 30%, transparent 72%);
  }
  .ring {
    position: absolute; left: 50%; top: 50%;
    width: 760px; height: 760px; margin: -380px 0 0 -380px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.22);
  }
  .ring.r2 { width: 900px; height: 900px; margin: -450px 0 0 -450px; border-color: rgba(255,255,255,.12); border-style: dashed; }
  .logo {
    position: absolute; left: 50%; top: 50%;
    width: 520px; height: 520px; margin: -260px 0 0 -260px;
    filter: drop-shadow(0 30px 50px rgba(20, 10, 80, .45));
  }
  .dot { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 0 24px #fff; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="ring r2"></div>
  <div class="ring"></div>
  <span class="dot" style="left: 879px; top: 529px"></span>
  <span class="dot" style="left: 165px; top: 400px; width: 14px; height: 14px; opacity: .8"></span>
  <!-- Monogramme K -->
  <svg class="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <path d="M14 10h9.5v18.5L39.5 10h12L33.5 30 53 54H40.5L23.5 32.5V54H14z" fill="#fff"/>
  </svg>
</body>
</html>
