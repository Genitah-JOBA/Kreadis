<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* Couverture Facebook 1640 x 624. Zone toujours visible (mobile) : x 265 → 1375 */
  html, body { margin: 0; width: 1640px; height: 624px; overflow: hidden; }
  body {
    position: relative;
    background: #0b0b14;
    font-family: 'Inter', sans-serif;
    color: #ecebf5;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(110px); }
  .g1 { width: 620px; height: 620px; background: #7c5cff; opacity: .55; left: 120px; top: -330px; }
  .g2 { width: 560px; height: 560px; background: #22d3ee; opacity: .28; right: 80px; bottom: -330px; }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent);
  }

  .text { position: absolute; left: 300px; top: 150px; width: 600px; }
  .brand { display: flex; align-items: center; gap: 16px; font-family: 'Sora'; font-weight: 800; font-size: 40px; }
  .brand svg { width: 60px; height: 60px; }
  h1 {
    font-family: 'Sora'; font-weight: 800; font-size: 50px; line-height: 1.08;
    letter-spacing: -0.02em; margin: 30px 0 22px;
  }
  .grad { color: #7c5cff; }
  .services { display: flex; flex-wrap: wrap; gap: 8px; }
  .services span {
    font-size: 15px; font-weight: 500; padding: 7px 13px; border-radius: 999px;
    background: rgba(124, 92, 255, .14); border: 1px solid rgba(155, 130, 255, .3); color: #d4cbff;
  }

  /* Maquettes */
  .browser {
    position: absolute; left: 905px; top: 92px; width: 440px; height: 330px;
    border-radius: 18px; background: #161627; border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 40px 80px rgba(0,0,0,.55); overflow: hidden; transform: rotate(-3deg);
  }
  .bar { height: 34px; display: flex; align-items: center; gap: 7px; padding: 0 14px; background: #1d1d31; }
  .bar i { width: 10px; height: 10px; border-radius: 50%; background: #ff5f57; }
  .bar i:nth-child(2) { background: #febc2e; } .bar i:nth-child(3) { background: #28c840; }
  .bar b { margin-left: 12px; height: 14px; width: 180px; border-radius: 7px; background: rgba(255,255,255,.08); }
  .page { padding: 20px; }
  .hero-b { height: 104px; border-radius: 12px; background: linear-gradient(135deg, #7c5cff, #22d3ee); position: relative; }
  .hero-b::before { content: ''; position: absolute; left: 18px; top: 22px; width: 150px; height: 14px; border-radius: 7px; background: rgba(255,255,255,.9); }
  .hero-b::after { content: ''; position: absolute; left: 18px; top: 46px; width: 100px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.55); box-shadow: 0 30px 0 -1px rgba(255,255,255,.95); }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
  .cards div { height: 118px; border-radius: 10px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.07); position: relative; }
  .cards div::before { content: ''; position: absolute; left: 12px; top: 12px; width: 28px; height: 28px; border-radius: 8px; background: rgba(34,211,238,.35); }
  .cards div::after { content: ''; position: absolute; left: 12px; top: 54px; width: 70%; height: 8px; border-radius: 4px; background: rgba(255,255,255,.15); box-shadow: 0 16px 0 rgba(255,255,255,.1), 0 32px 0 rgba(255,255,255,.07); }

  .phone {
    position: absolute; left: 1190px; top: 176px; width: 158px; height: 318px;
    border-radius: 30px; background: #0f0f1c; border: 5px solid #2a2a40;
    box-shadow: 0 40px 80px rgba(0,0,0,.6); overflow: hidden; transform: rotate(6deg);
  }
  .phone .notch { width: 56px; height: 14px; border-radius: 0 0 10px 10px; background: #2a2a40; margin: 0 auto 12px; }
  .phone .p-head { margin: 0 12px; height: 70px; border-radius: 14px; background: linear-gradient(135deg, #22d3ee, #7c5cff); }
  .phone .p-row { margin: 10px 12px 0; height: 42px; border-radius: 10px; background: rgba(255,255,255,.06); position: relative; }
  .phone .p-row::before { content: ''; position: absolute; left: 8px; top: 9px; width: 24px; height: 24px; border-radius: 50%; background: rgba(155,130,255,.5); }
  .phone .p-row::after { content: ''; position: absolute; left: 40px; top: 12px; width: 70px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.2); box-shadow: 0 11px 0 rgba(255,255,255,.1); }
  .phone .p-btn { margin: 14px 12px 0; height: 30px; border-radius: 999px; background: #7c5cff; }

  .chip {
    position: absolute; display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-radius: 14px; font-weight: 600; font-size: 15px;
    background: rgba(23,23,38,.92); border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 20px 40px rgba(0,0,0,.5);
  }
  .chip svg { width: 22px; height: 22px; color: #22d3ee; }
  .c1 { left: 880px; top: 400px; }
  .c2 { left: 1150px; top: 58px; }
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="text">
    <div class="brand">
      <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="18" fill="#ecebf5"/><path d="M17 13h8v15.5L38 13h10L34.5 29 49 51H39L28 34.5 25 38v13h-8z" fill="#0b0b14"/><circle cx="49" cy="49" r="7" fill="#7c5cff" stroke="#ecebf5" stroke-width="3"/></svg>
      Kreadis
    </div>
    <h1>Des expériences <span class="grad">digitales</span> qui font grandir votre activité.</h1>
    <div class="services">
      <span>Design UI/UX</span><span>Web</span><span>Mobile</span><span>Webmastering</span><span>Maintenance</span>
    </div>
  </div>

  <div class="browser">
    <div class="bar"><i></i><i></i><i></i><b></b></div>
    <div class="page">
      <div class="hero-b"></div>
      <div class="cards"><div></div><div></div><div></div></div>
    </div>
  </div>

  <div class="phone">
    <div class="notch"></div>
    <div class="p-head"></div>
    <div class="p-row"></div>
    <div class="p-row"></div>
    <div class="p-row"></div>
    <div class="p-btn"></div>
  </div>

  <div class="chip c1">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
    Design sur mesure
  </div>
  <div class="chip c2">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg>
    Code moderne
  </div>
</body>
</html>
