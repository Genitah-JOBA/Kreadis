<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1600px; height: 900px; background: #0b0b14; color: #ecebf5; font-family: 'Sora'; }
  .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; padding: 48px; }
  .opt { background: #11111d; border: 1px solid rgba(255,255,255,.08); border-radius: 24px; padding: 34px 20px 28px; display: flex; flex-direction: column; align-items: center; gap: 28px; }
  .num { align-self: flex-start; font-size: 22px; font-weight: 800; color: #22d3ee; margin: -10px 0 -10px 8px; }
  .mark { width: 200px; height: 200px; }
  .lockup { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 30px; letter-spacing: -0.02em; }
  .lockup svg { width: 46px; height: 46px; }
  .light { background: #fff; color: #0b0b14; border-radius: 14px; padding: 14px 20px; }
  .circle { width: 120px; height: 120px; border-radius: 50%; overflow: hidden; }
  .circle svg { width: 100%; height: 100%; }
  .row { display: flex; align-items: center; gap: 20px; }
  .name { font-family: 'Inter'; font-weight: 500; color: #a2a1b8; font-size: 17px; text-align: center; }
  .lower { text-transform: lowercase; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="kg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>

    <!-- 1 · Chevron : barre + chevron de code < -->
    <symbol id="m1" viewBox="0 0 64 64">
      <rect x="12" y="10" width="10" height="44" rx="5" fill="url(#kg)"/>
      <path d="M50 12 30 32l20 20" fill="none" stroke="url(#kg)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- 2 · Facettes : K géométrique en deux formes -->
    <symbol id="m2" viewBox="0 0 64 64">
      <path d="M10 8h14v48H10z" fill="#7c5cff"/>
      <path d="M24 32 46 8h16L40 32z" fill="#22d3ee"/>
      <path d="M24 32h16l22 24H46z" fill="#5b8cff"/>
    </symbol>

    <!-- 3 · Curseur : K + point de sélection (design) -->
    <symbol id="m3" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="18" fill="#ecebf5"/>
      <path d="M17 13h8v15.5L38 13h10L34.5 29 49 51H39L28 34.5 25 38v13h-8z" fill="#0b0b14"/>
      <circle cx="49" cy="49" r="7" fill="url(#kg)" stroke="#ecebf5" stroke-width="3"/>
    </symbol>

    <!-- 4 · Pixel : K formé de carrés (UI / grille) -->
    <symbol id="m4" viewBox="0 0 64 64">
      <g fill="url(#kg)">
        <rect x="9" y="5" width="9" height="9" rx="2.5"/><rect x="9" y="15.5" width="9" height="9" rx="2.5"/><rect x="9" y="26" width="9" height="9" rx="2.5"/><rect x="9" y="36.5" width="9" height="9" rx="2.5"/><rect x="9" y="47" width="9" height="9" rx="2.5"/><rect x="20" y="26" width="9" height="9" rx="2.5" opacity=".8"/><rect x="31" y="15.5" width="9" height="9" rx="2.5"/><rect x="31" y="36.5" width="9" height="9" rx="2.5"/><rect x="42" y="5" width="9" height="9" rx="2.5"/><rect x="42" y="47" width="9" height="9" rx="2.5"/>
      </g>
    </symbol>
  </defs>
</svg>

<div class="board">
  <div class="opt">
    <div class="num">1</div>
    <svg class="mark"><use href="#m1"/></svg>
    <div class="lockup lower"><svg><use href="#m1"/></svg>kreadis</div>
    <div class="row">
      <div class="circle"><svg viewBox="0 0 64 64"><rect width="64" height="64" fill="#0b0b14"/><svg x="14" y="14" width="36" height="36"><use href="#m1"/></svg></svg></div>
      <div class="lockup light lower" style="font-size:22px"><svg style="width:30px;height:30px"><use href="#m1"/></svg>kreadis</div>
    </div>
    <div class="name">Chevron<br/>le K devient un symbole de code « &lt; »</div>
  </div>

  <div class="opt">
    <div class="num">2</div>
    <svg class="mark"><use href="#m2"/></svg>
    <div class="lockup"><svg><use href="#m2"/></svg>Kreadis</div>
    <div class="row">
      <div class="circle"><svg viewBox="0 0 64 64"><rect width="64" height="64" fill="#0b0b14"/><svg x="15" y="15" width="34" height="34"><use href="#m2"/></svg></svg></div>
      <div class="lockup light" style="font-size:22px"><svg style="width:30px;height:30px"><use href="#m2"/></svg>Kreadis</div>
    </div>
    <div class="name">Facettes<br/>K géométrique en trois formes colorées</div>
  </div>

  <div class="opt">
    <div class="num">3</div>
    <svg class="mark"><use href="#m3"/></svg>
    <div class="lockup"><svg><use href="#m3"/></svg>Kreadis</div>
    <div class="row">
      <div class="circle"><svg viewBox="0 0 64 64"><rect width="64" height="64" fill="#0b0b14"/><svg x="14" y="14" width="36" height="36"><use href="#m3"/></svg></svg></div>
      <div class="lockup light" style="font-size:22px"><svg style="width:30px;height:30px"><use href="#m3"/></svg>Kreadis</div>
    </div>
    <div class="name">Curseur<br/>K sobre + point de sélection en dégradé</div>
  </div>

  <div class="opt">
    <div class="num">4</div>
    <svg class="mark"><use href="#m4"/></svg>
    <div class="lockup"><svg><use href="#m4"/></svg>Kreadis</div>
    <div class="row">
      <div class="circle"><svg viewBox="0 0 64 64"><rect width="64" height="64" fill="#0b0b14"/><svg x="14" y="14" width="36" height="36"><use href="#m4"/></svg></svg></div>
      <div class="lockup light" style="font-size:22px"><svg style="width:30px;height:30px"><use href="#m4"/></svg>Kreadis</div>
    </div>
    <div class="name">Pixel<br/>K formé de blocs, comme une interface</div>
  </div>
</div>
</body>
</html>
